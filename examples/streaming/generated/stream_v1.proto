syntax = "proto3";

package stream.v1;

message ChatRespondRequest {
  optional string prompt = 1;
  optional int32 tokens_per_second = 2;
  optional int32 max_tokens = 3;
}

message ChatEvent {
  optional int32 sequence = 1;
  optional string kind = 2;
  optional string content = 3;
  optional double sent_at_unix_ms = 4;
  optional double progress = 5;
}

service ChatService {
  // tRPC subscription chat.respond
  rpc Respond (ChatRespondRequest) returns (stream ChatEvent);
}
