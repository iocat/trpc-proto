<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a12" />
    <title>Protocol Studio · trpc.v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#/echo" aria-label="Protocol Studio home">
          <span class="brand-mark">t/</span>
          <span>
            <strong>Protocol Studio</strong>
            <small>trpc.v1 workspace</small>
          </span>
        </a>

        <p class="nav-label">Playground</p>
        <nav aria-label="Procedures">
          <a href="#/echo">
            <span class="nav-glyph">↗</span>
            <span>Echo console</span>
            <small>01</small>
          </a>
          <a href="#/notes">
            <span class="nav-glyph">N</span>
            <span>Notes</span>
            <small>02</small>
          </a>
          <a href="#/stream">
            <span class="nav-glyph">≈</span>
            <span>Live stream</span>
            <small>03</small>
          </a>
        </nav>

        <div class="sidebar-space"></div>
        <div class="connection-card">
          <div class="connection-heading">
            <span class="signal-dot" aria-hidden="true"></span>
            <span>All systems operational</span>
          </div>
          <p>Browser → gRPC-Web<br />→ TypeScript tRPC</p>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <span>trpc.v1</span>
            <i>/</i>
            <strong id="route-label">echo</strong>
          </div>
          <div class="connection-pill">
            <span class="signal-dot" aria-hidden="true"></span>
            <span id="status">connecting…</span>
            <i>HTTP/2</i>
          </div>
        </header>
        <main id="app"></main>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
