<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>todo</title>
  <style>
    :root {
      --bg: #14120f;
      --panel: #1d1a15;
      --ink: #efe6d4;
      --muted: #9a8f7a;
      --line: #3a342a;
      --accent: #d4a017;
      --ok: #7ea36b;
      --bad: #c45c4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
    }
    header {
      padding: 28px 32px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    #status { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    header .auth { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    header .auth label { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    header .auth input { width: 280px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      padding: 24px 32px 48px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 16px 18px 18px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, select, button, textarea {
      font: inherit;
      width: 100%;
      background: #12100c;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 8px 10px;
    }
    button {
      margin-top: 12px;
      cursor: pointer;
      background: var(--accent);
      color: #1a150c;
      border: 0;
      font-weight: 600;
    }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button.tiny { width: auto; margin: 0; padding: 4px 8px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .done { color: var(--muted); text-decoration: line-through; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row select { width: auto; }
    pre {
      margin: 12px 0 0;
      font: 12px/1.4 ui-monospace, Menlo, monospace;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>todo</h1>
      <p>browser protobuf → gRPC binary → Go</p>
    </div>
    <div class="auth">
      <label for="auth-token">Bearer</label>
      <input id="auth-token" value="__AUTH_TOKEN__" spellcheck="false" />
      <div id="status">connecting…</div>
    </div>
  </header>
  <main>
    <section>
      <h2>Create</h2>
      <label>Title</label>
      <input id="title" value="Write tests" />
      <label>Notes</label>
      <input id="notes" value="codec + auth" />
      <button id="create-btn">Add todo</button>
      <pre id="create-out"></pre>
    </section>
    <section>
      <h2>List</h2>
      <div class="row">
        <select id="filter">
          <option value="">all</option>
          <option value="open">open</option>
          <option value="done">done</option>
        </select>
        <button class="secondary tiny" id="list-btn">Refresh</button>
      </div>
      <table>
        <thead>
          <tr><th></th><th>Title</th><th>Notes</th><th></th></tr>
        </thead>
        <tbody id="todo-rows"></tbody>
      </table>
    </section>
  </main>
  <script src="/vendor/protobuf.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const PKG = 'todo.v1';
    let root;

    function typeName(name) {
      return name.startsWith('google.') ? name : PKG + '.' + name;
    }

    async function rpc(service, method, reqType, payload, resType) {
      const Req = root.lookupType(typeName(reqType));
      const Res = root.lookupType(typeName(resType));
      const bytes = Req.encode(Req.create(payload || {})).finish();
      const res = await fetch('/rpc/' + service + '/' + method, {
        method: 'POST',
        headers: {
          'content-type': 'application/x-protobuf',
          authorization: 'Bearer ' + $('auth-token').value,
        },
        body: bytes,
      });
      const buf = new Uint8Array(await res.arrayBuffer());
      if (!res.ok) throw new Error(new TextDecoder().decode(buf) || res.statusText);
      $('status').textContent =
        'protobuf ' + bytes.length + 'B → ' + buf.length + 'B · /' + PKG + '.' + service + '/' + method;
      $('status').className = 'ok';
      return Res.toObject(Res.decode(buf), {
        defaults: true,
        longs: String,
        enums: String,
        bytes: String,
      });
    }

    async function refresh() {
      const filter = $('filter').value;
      const payload = filter === 'open' ? { done: false } : filter === 'done' ? { done: true } : {};
      const listed = await rpc('TodoService', 'List', 'TodoListRequest', payload, 'TodoListResponse');
      const rows = $('todo-rows');
      rows.innerHTML = (listed.items || []).map((todo) => {
        const titleClass = todo.done ? ' class="done"' : '';
        return '<tr data-id="' + todo.id + '">' +
          '<td><input type="checkbox" class="toggle"' + (todo.done ? ' checked' : '') + ' /></td>' +
          '<td' + titleClass + '>' + todo.title + '</td>' +
          '<td>' + (todo.notes || '') + '</td>' +
          '<td><button class="secondary tiny del">Delete</button></td>' +
        '</tr>';
      }).join('');
    }

    protobuf.load('/proto/todo_v1.proto', async (err, loaded) => {
      if (err) {
        $('status').className = 'bad';
        $('status').textContent = String(err);
        return;
      }
      root = loaded;
      $('status').textContent = 'ready';
      $('status').className = 'ok';
      try {
        const health = await rpc('App', 'Health', 'google.protobuf.Empty', {}, 'AppHealthResponse');
        $('status').textContent += ' · health ' + health.ok;
        await refresh();
      } catch (e) {
        $('status').className = 'bad';
        $('status').textContent = String(e.message || e);
      }
    });

    $('create-btn').onclick = async () => {
      try {
        const created = await rpc('TodoService', 'Create', 'TodoCreateRequest', {
          title: $('title').value,
          notes: $('notes').value || undefined,
        }, 'Todo');
        $('create-out').textContent = JSON.stringify(created, null, 2);
        await refresh();
      } catch (e) {
        $('status').className = 'bad';
        $('status').textContent = String(e.message || e);
      }
    };

    $('list-btn').onclick = () => refresh().catch((e) => {
      $('status').className = 'bad';
      $('status').textContent = String(e.message || e);
    });
    $('filter').onchange = () => refresh().catch((e) => {
      $('status').className = 'bad';
      $('status').textContent = String(e.message || e);
    });

    $('todo-rows').onclick = async (event) => {
      const row = event.target.closest('tr');
      if (!row) return;
      const id = row.dataset.id;
      try {
        if (event.target.classList.contains('toggle')) {
          await rpc('TodoService', 'SetDone', 'TodoSetDoneRequest', {
            id,
            done: event.target.checked,
          }, 'Todo');
          await refresh();
        }
        if (event.target.classList.contains('del')) {
          await rpc('TodoService', 'Remove', 'TodoGetByIdRequest', { id }, 'TodoGetByIdRequest');
          await refresh();
        }
      } catch (e) {
        $('status').className = 'bad';
        $('status').textContent = String(e.message || e);
      }
    };
  </script>
</body>
</html>
