name: Bug report
description: Report reproducible incorrect behavior
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve trpc-proto. Please provide a minimal reproduction.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest router, schema, or repository that reproduces the problem.
      placeholder: Repository URL or code sample
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include complete errors and relevant generated protobuf output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: '@trpc-proto/runtime 0.0.0 or commit SHA'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'Node, pnpm, TypeScript, tRPC, and Zod versions'
    validations:
      required: true
